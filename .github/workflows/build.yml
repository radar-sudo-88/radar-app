name: Build (legacy Android 6+)

# Legacy branch: Expo SDK 51 / React Native 0.74 / MapLibre RN 10 so the APK installs on Android 6.0 (API 23) and up.
# The modern build (Android 7+, iOS) lives on main.

on:
  push:
    branches: [legacy-android]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-legacy-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_API_BASE: https://aero-sentry.co.uk
  EXPO_PUBLIC_MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}

jobs:
  android:
    name: Android 6+ (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-audit --no-fund
      - name: Generate native Android project (minSdk 23)
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK (debug-keystore signed, installable)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../AeroSentry-legacy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-legacy-apk
          path: AeroSentry-legacy.apk

  release:
    name: Publish release
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "legacy-build-${{ github.run_number }}" dist/AeroSentry-legacy.apk \
            --repo "${{ github.repository }}" \
            --title "Aero Sentry legacy build ${{ github.run_number }} (Android 6+)" \
            --notes "For Android 6.0+ devices. Installs directly; allow installs from unknown sources." \
            --prerelease
