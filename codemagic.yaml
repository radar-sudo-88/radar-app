workflows:
  aero-sentry-ios:
    name: Aero Sentry iOS (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        EXPO_PUBLIC_API_BASE: https://aero-sentry.co.uk
        GITHUB_REPOSITORY: radar-sudo-88/radar-app
      # Add a Codemagic variable group containing GITHUB_TOKEN (repo scope) to auto-publish releases.
      groups:
        - github
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install JS dependencies
        script: |
          npm ci --no-audit --no-fund
      - name: Generate native iOS project
        script: |
          npx expo prebuild --platform ios --no-install
      - name: Install pods
        script: |
          cd ios
          pod install
      - name: Build unsigned archive
        script: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
      - name: Package unsigned IPA
        script: |
          cd ios/build
          APP=$(ls -d App.xcarchive/Products/Applications/*.app | head -n 1)
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr AeroSentry.ipa Payload
          ls -lh AeroSentry.ipa
    artifacts:
      - ios/build/AeroSentry.ipa
    publishing:
      scripts:
        - name: Publish to GitHub Releases
          script: |
            if [ -z "$GITHUB_TOKEN" ]; then echo "GITHUB_TOKEN not set - skipping release upload"; exit 0; fi
            sh scripts/publish-release.sh ios/build/AeroSentry.ipa

  aero-sentry-android:
    name: Aero Sentry Android (APK)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      node: 22
      java: 17
      vars:
        EXPO_PUBLIC_API_BASE: https://aero-sentry.co.uk
        GITHUB_REPOSITORY: radar-sudo-88/radar-app
      # Variable group "android": GOOGLE_MAPS_API_KEY (Maps SDK for Android) and optional GITHUB_TOKEN.
      groups:
        - android
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install JS dependencies
        script: |
          npm ci --no-audit --no-fund
      - name: Generate native Android project
        script: |
          npx expo prebuild --platform android --no-install
      - name: Build release APK (debug-keystore signed, installable)
        script: |
          cd android
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../AeroSentry.apk
    artifacts:
      - AeroSentry.apk
    publishing:
      scripts:
        - name: Publish to GitHub Releases
          script: |
            if [ -z "$GITHUB_TOKEN" ]; then echo "GITHUB_TOKEN not set - skipping release upload"; exit 0; fi
            sh scripts/publish-release.sh AeroSentry.apk
